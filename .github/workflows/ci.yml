name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Python Linters & Packages
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          pip install -r backend/requirements-inference.txt
          pip install -e backend/

      - name: Python Ruff Linting
        run: ruff check backend/ scripts/

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Oxlint
        run: |
          cd frontend
          npm run lint

      - name: Frontend TypeScript Build Check
        run: |
          cd frontend
          npm run build

      - name: Frontend Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Guardrail - Static Metric Literal & Physical Sensor Name Check
        run: |
          python scripts/check_guardrails.py

      - name: Guardrail - Model Bundle Dependency Pin Parity Check
        run: |
          python scripts/check_bundle_pins.py

      - name: Guardrail - Model Bundle Code Byte-Identity Check
        run: |
          python scripts/check_bundle_code.py

      - name: Guardrail - Model Bundle Cryptographic Manifest Check
        run: |
          python scripts/check_bundle_manifest.py

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: predict_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install -r backend/requirements-inference.txt
          pip install -e backend/

      - name: Run Backend Integration & DB Tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/predict_ai_test
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_minimum_32_characters_long
        run: pytest backend/tests/ -v

  e2e-playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: predict_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-inference.txt
          pip install -e backend/

      - name: Run Database Migrations & Seed Demo
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/predict_ai
          DATABASE_URL_DIRECT: postgresql+psycopg://postgres:postgrespassword@localhost:5432/predict_ai
          ENVIRONMENT: development
          SECRET_KEY: test_secret_key_minimum_32_characters_long
        run: |
          cd backend
          alembic upgrade head
          python -m app.cli seed-demo --bundle-path model_artifacts/cmapss-fd001-h30-20261001T203719Z

      - name: Start FastAPI Backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/predict_ai
          ENVIRONMENT: development
          SECRET_KEY: test_secret_key_minimum_32_characters_long
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &

      - name: Install Frontend Dependencies & Playwright Browsers
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests Against Seeded DB
        run: |
          cd frontend
          npx playwright test
