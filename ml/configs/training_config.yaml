version: "1.0.0"
dataset: "NASA C-MAPSS FD001"

# Candidate prediction horizons evaluated
candidate_horizons: [20, 25, 30, 35, 40]
selected_horizon: 30
horizon_unit: "cycles"

# Cross-validation protocol
split_protocol: "GroupKFold (grouped by engine unit_id)"
n_splits: 5
random_state: 42

# Early life cycles definition for healthy baseline
healthy_cycles_cutoff: 30

# Failure risk classification settings
models:
  logistic_regression:
    max_iter: 1000
    C: 1.0
  random_forest:
    n_estimators: 100
    max_depth: 8
    random_state: 42
  xgboost:
    n_estimators: 150
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

# Decision threshold
decision_threshold: 0.50

# Probability calibration method
calibration_method: "sigmoid" # Platt scaling

# Anomaly detector settings
anomaly_detection:
  algorithm: "IsolationForest"
  contamination: 0.05
  n_estimators: 100
  random_state: 42
  target_fpr: 0.02
