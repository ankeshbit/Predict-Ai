version: "1.0.0"
dataset_adapter: "cmapss_fd001_csv"
canonical_id_column: "unit_id"
canonical_cycle_column: "cycle"

operating_settings:
  - "op_setting_1"
  - "op_setting_2"
  - "op_setting_3"

raw_sensors:
  - "sensor_1"
  - "sensor_2"
  - "sensor_3"
  - "sensor_4"
  - "sensor_5"
  - "sensor_6"
  - "sensor_7"
  - "sensor_8"
  - "sensor_9"
  - "sensor_10"
  - "sensor_11"
  - "sensor_12"
  - "sensor_13"
  - "sensor_14"
  - "sensor_15"
  - "sensor_16"
  - "sensor_17"
  - "sensor_18"
  - "sensor_19"
  - "sensor_20"
  - "sensor_21"

# Automatically dropped by empirical low-variance rule on training split
constant_sensors_dropped:
  - "sensor_1"
  - "sensor_5"
  - "sensor_6"
  - "sensor_10"
  - "sensor_16"
  - "sensor_18"
  - "sensor_19"
  - "op_setting_3"

active_sensor_channels:
  - "sensor_2"
  - "sensor_3"
  - "sensor_4"
  - "sensor_7"
  - "sensor_8"
  - "sensor_9"
  - "sensor_11"
  - "sensor_12"
  - "sensor_13"
  - "sensor_14"
  - "sensor_15"
  - "sensor_17"
  - "sensor_20"
  - "sensor_21"

window_sizes: [5, 10, 20]
transformations:
  - "rolling_mean"
  - "rolling_std"
  - "first_diff"
  - "window_slope"
  - "robust_z_vs_baseline"
