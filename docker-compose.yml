version: '3.8'

services:
  # Local throwaway PostgreSQL instance for running tests and offline development
  # (Production runs against serverless Neon PostgreSQL)
  test-postgres:
    image: postgres:16-alpine
    container_name: predict_ai_test_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: predict_ai
    ports:
      - "5432:5432"
    volumes:
      - test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: predict_ai_backend
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@test-postgres:5432/predict_ai
      - DATABASE_URL_DIRECT=postgresql://postgres:postgrespassword@test-postgres:5432/predict_ai
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./backend/model_artifacts:/app/backend/model_artifacts
      - ./backend/app:/app/backend/app
    ports:
      - "8000:8000"
    depends_on:
      test-postgres:
        condition: service_healthy

volumes:
  test_pgdata:
    driver: local
